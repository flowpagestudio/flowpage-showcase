<!doctype html><html lang="he" dir="rtl"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Arial;background:#f7f7f1;color:#15251e}.hero{padding:58px 8%;background:linear-gradient(90deg,#f7f7f1eF,#f7f7f19C),url('https://raw.githubusercontent.com/flowpagestudio/flowpage-assets/main/02_scenarios/computer-technician/hero/hero-computer-technician-v1.png') center/cover}h1{font-size:48px;margin:0}em{color:#739100;font-style:normal}.desk{padding:42px 8%;background:#fff}.card{border:1px solid #d4ddd4;background:#f7f7f1;padding:18px;margin:12px 0}.id{color:#739100;font-weight:bold}.row{display:flex;justify-content:space-between;gap:15px}.desc{background:#fff;border-right:3px solid #d7f255;padding:10px;margin-top:12px}.error{color:#a22;padding:18px;background:#ffe8e3}@media(max-width:600px){.hero,.desk{padding:35px 22px}.row{display:block}}</style></head><body><section class="hero"><small>PRIVATE OWNER SPACE</small><h1>ניהול <em>המערכת.</em></h1><p>פניות נכנסות מהמערכת הפעילה.</p><p><b id="count">–</b> פניות חדשות</p></section><main class="desk"><h2>פניות פעילות</h2><div id="out">טוען פניות…</div></main><script>function e(v){return String(v||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function show(data){var out=document.getElementById('out');document.getElementById('count').textContent=data.newCount;out.innerHTML='';if(!data.leads.length){out.textContent='אין פניות כרגע.';return}data.leads.forEach(function(l){var a=document.createElement('article');a.className='card';a.innerHTML='<div class="row"><div><span class="id">'+e(l.id)+'</span><h3>'+e(l.name)+' · '+e(l.issue)+'</h3><small>'+e(l.phone)+' · '+e(l.email)+'</small></div><select data-id="'+e(l.id)+'"><option>חדש</option><option>בטיפול</option><option>נקבע ביומן</option><option>הושלם</option><option>בוטל</option></select></div><div class="desc">'+e(l.description)+'</div>';var s=a.querySelector('select');s.value=l.status;s.onchange=function(){google.script.run.withSuccessHandler(load).withFailureHandler(fail).updateLeadStatus(l.id,s.value)};out.appendChild(a)})}function fail(x){document.getElementById('out').innerHTML='<div class="error">'+e(x.message||x)+'</div>'}function load(){google.script.run.withSuccessHandler(show).withFailureHandler(fail).getManagementData()}load()</script></body></html>
