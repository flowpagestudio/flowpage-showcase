<!doctype html><html lang="he" dir="rtl"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--i:#15251e;--l:#d7f255;--p:#f7f7f1}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Arial}.top{padding:28px;display:flex;justify-content:space-between;background:white}.hero,.desk{padding:55px max(22px,calc((100vw - 1000px)/2))}.hero{position:relative;isolation:isolate;background:linear-gradient(90deg,rgba(247,247,241,.98),rgba(247,247,241,.82) 50%,rgba(247,247,241,.22)),url('https://raw.githubusercontent.com/flowpagestudio/flowpage-assets/main/02_scenarios/computer-technician/hero/hero-computer-technician-v1.png') center/cover}h1{font-size:54px;margin:0}.hero em{color:#739100;font-style:normal}.chip{background:#e8f7b9;padding:7px;font-size:13px}.desk{background:white}.card{border:1px solid #d4ddd4;padding:18px;margin:12px 0;background:var(--p)}.id{color:#739100;font-weight:bold}.row{display:flex;justify-content:space-between;gap:12px}.desc{background:white;border-right:3px solid var(--l);padding:10px;margin-top:12px}.files a{display:inline-block;margin:12px 8px 0 0;color:var(--i)}select,button{padding:9px;font:inherit}button{background:var(--i);color:white;border:0}@media(max-width:600px){h1{font-size:42px}.hero,.desk{padding:38px 20px}.row{display:block}select{margin-top:10px}}</style></head><body><header class="top"><b>FLOWPAGE STUDIO</b><span class="chip">גישה מורשית בלבד</span></header><section class="hero"><small>PRIVATE OWNER SPACE</small><h1>ניהול <em>המערכת.</em></h1><p>פניות, קבצים ועדכוני סטטוס במקום אחד.</p><b id="count">–</b> פניות חדשות</section><main class="desk"><h2>פניות פעילות</h2><div id="leads">טוען…</div><section class="desk"><h2>ניהול גלריה</h2><p>חמשת מיקומי התמונות באתר.</p><div id="gallery">טוען גלריה…</div></section></main><script>const e=document.getElementById('leads');function x(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function load(){google.script.run.withSuccessHandler(d=>{document.getElementById('count').textContent=d.newCount;e.innerHTML=d.leads.map(l=>'<article class="card"><div class="row"><div><span class="id">'+x(l.id)+'</span><h3>'+x(l.name)+' · '+x(l.issue)+'</h3><small>'+x(l.phone)+' · '+x(l.email)+'</small></div><select onchange="setStatus('+JSON.stringify(l.id)+',this.value)">'+['חדש','בטיפול','נקבע ביומן','הושלם','בוטל'].map(s=>'<option '+(s===l.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="desc">'+x(l.description)+'</div><div class="files">'+l.files.map((f,i)=>'<a target="_blank" href="'+x(f)+'">קובץ '+(i+1)+'</a>').join('')+(l.eventId?' <a target="_blank" href="https://calendar.google.com/calendar/u/0/r/search/'+encodeURIComponent(l.eventId)+'">פתיחה ביומן</a>':'')+'</div></article>').join('')||'אין פניות כרגע'}).withFailureHandler(err=>e.textContent=err.message||String(err)).getManagementData()}function setStatus(id,s){google.script.run.withSuccessHandler(load).withFailureHandler(err=>alert(err.message||err)).updateLeadStatus(id,s)}google.script.run.withSuccessHandler(g=>{document.getElementById('gallery').innerHTML=g.map(x=>'<article class="card"><b>'+x.slot+'</b><h3>'+x.title+'</h3><img src="'+x.url+'" style="width:100%;max-height:180px;object-fit:cover"><p>'+x.description+'</p><button disabled>החלפת תמונה — בקרוב</button></article>').join('')}).getGalleryData();load()</script></body></html>
