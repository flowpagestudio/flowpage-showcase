<!doctype html>
<html lang="he" dir="rtl">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink:#14231c; --accent:#d6ff42; --paper:#f7f7f1; --line:#d8ddd6; --muted:#6b756e; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); font-family:Arial,sans-serif; color:var(--ink); }
    main { max-width:760px; margin:auto; padding:32px 18px 54px; } .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:bold}
    h1{font-size:clamp(31px,6vw,52px);line-height:1;margin:12px 0 13px}.intro{max-width:560px;color:var(--muted);line-height:1.55}
    form{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 40px #1323120b}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wide{grid-column:1/-1}label{display:grid;gap:7px;font-size:14px;font-weight:bold}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:112px;resize:vertical}
    .hint{font-size:12px;color:var(--muted);font-weight:normal}button{border:0;border-radius:10px;background:var(--accent);padding:15px 18px;font-weight:800;font-size:16px;cursor:pointer;margin-top:22px;width:100%}
    button:disabled{opacity:.6;cursor:wait}.result{margin-top:18px;border-radius:10px;padding:13px;display:none;line-height:1.5}.result.ok{display:block;background:#eff9cc}.result.err{display:block;background:#ffe7e4}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}form{padding:17px}}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">FLOWPAGE STUDIO / SERVICE REQUEST</div>
  <h1>צריכים טכנאי מחשבים?</h1>
  <p class="intro">השאירו פרטים ותיאור קצר של התקלה. במקרה של ביקור טכנאי אפשר גם לבחור מועד מועדף.</p>
  <form id="leadForm">
    <div class="grid">
      <label>שם מלא*<input name="fullName" required></label>
      <label>טלפון*<input name="phone" type="tel" required></label>
      <label>אימייל*<input name="email" type="email" required></label>
      <label>סוג תקלה*<select name="issueType" required><option value="">בחרו</option><option>מחשב לא נדלק</option><option>איטי / תקוע</option><option>וירוס / אבטחה</option><option>אינטרנט / רשת</option><option>גיבוי / העברת מידע</option><option>אחר</option></select></label>
      <label>מותג / דגם<input name="deviceModel"></label>
      <label>סוג שירות*<select name="serviceType" id="serviceType" required><option value="">בחרו</option><option>ביקור טכנאי</option><option>ייעוץ מרחוק</option><option>אבחון / הצעת מחיר</option></select></label>
      <label class="wide">תיאור התקלה*<textarea name="description" required placeholder="מה קורה בפועל? מתי זה התחיל?"></textarea></label>
      <label>כתובת <span class="hint">נדרש לביקור</span><input name="address"></label>
      <label>מועד מועדף <span class="hint">לביקור טכנאי</span><input name="preferredDateTime" type="datetime-local"></label>
      <label class="wide">קבצים מצורפים <span class="hint">צילום מסך או PDF, עד 8MB לכל קובץ</span><input name="files" type="file" accept="image/jpeg,image/png,application/pdf" multiple></label>
    </div>
    <button id="submit" type="submit">שליחת פנייה</button>
    <div id="result" class="result"></div>
  </form>
</main>
<script>
const form=document.getElementById('leadForm'), button=document.getElementById('submit'), result=document.getElementById('result');
form.addEventListener('submit', async function(event) {
  event.preventDefault(); button.disabled=true; button.textContent='שולח...'; result.className='result'; result.style.display='none';
  try {
    const formData=new FormData(form), attachments=await Promise.all([...form.elements.files.files].map(readFile));
    const payload=Object.fromEntries(formData.entries()); delete payload.files; payload.attachments=attachments;
    google.script.run.withSuccessHandler(showSuccess).withFailureHandler(showError).submitLead(payload);
  } catch (err) { showError(err.message || 'לא ניתן לקרוא את הקובץ.'); }
});
function readFile(file) {
  return new Promise((resolve,reject) => {
    if(file.size>8*1024*1024) return reject(new Error('כל קובץ מוגבל ל־8MB.'));
    const reader=new FileReader();
    reader.onload=() => resolve({name:file.name,mimeType:file.type,size:file.size,base64:String(reader.result).split(',')[1]});
    reader.onerror=() => reject(new Error('קריאת הקובץ נכשלה.'));
    reader.readAsDataURL(file);
  });
}
function showSuccess(data){result.className='result ok';result.textContent=data.message+' מספר הפנייה שלך: '+data.leadId;result.style.display='block';form.reset();button.disabled=false;button.textContent='שליחת פנייה';}
function showError(error){result.className='result err';result.textContent=(error.message||String(error));result.style.display='block';button.disabled=false;button.textContent='שליחת פנייה';}
</script>
</body>
</html>
