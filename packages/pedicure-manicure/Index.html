<!doctype html><html lang="he" dir="rtl"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קביעת תור</title><style>body{font-family:Arial,sans-serif;max-width:620px;margin:40px auto;padding:0 20px;background:#fff8f7;color:#432d35}h1{font-size:38px}label{display:block;font-weight:bold;margin-top:15px}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #d7bec5;border-radius:7px;font-size:16px}button{margin-top:22px;background:#a6536e;color:white;border:0;border-radius:7px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer}.note,#result{line-height:1.6;color:#806b72;margin-top:14px}.error{color:#a22b3e}</style></head><body><h1>קובעים זמן לעצמך.</h1><p class="note">א׳–ה׳, 16:00–21:00. שינוי או ביטול עד 48 שעות לפני התור.</p><form id="form"><label>שם מלא<input name="fullName" required></label><label>טלפון<input name="phone" inputmode="tel" required></label><label>אימייל <small>(לאישור התור)</small><input name="email" type="email"></label><label>טיפול<select name="serviceId" id="service" required></select></label><label>תאריך<input name="date" id="date" type="date" required></label><label>שעה פנויה<select name="time" id="time" required><option value="">בחרי קודם טיפול ותאריך</option></select></label><button>אישור תור</button></form><div id="result"></div><script>const s=document.querySelector('#service'),d=document.querySelector('#date'),t=document.querySelector('#time'),r=document.querySelector('#result');function err(e){r.className='error';r.textContent=e&&e.message?e.message:String(e)}google.script.run.withSuccessHandler(c=>{s.innerHTML='<option value="">בחירת טיפול</option>'+c.services.map(x=>'<option value="'+x.id+'">'+x.name+' — '+x.minutes+' דקות</option>').join('')}).withFailureHandler(err).getPublicConfig();function slots(){if(!s.value||!d.value)return;t.innerHTML='<option>טוען שעות…</option>';google.script.run.withSuccessHandler(a=>{t.innerHTML='<option value="">בחירת שעה</option>'+a.map(x=>'<option>'+x+'</option>').join('')}).withFailureHandler(err).getAvailableSlots(d.value,s.value)}s.onchange=slots;d.onchange=slots;document.querySelector('#form').onsubmit=e=>{e.preventDefault();r.className='';r.textContent='שומר את התור…';const x=Object.fromEntries(new FormData(e.target));google.script.run.withSuccessHandler(a=>{r.textContent='התור נקבע בהצלחה: '+a.service+' · '+a.start;e.target.reset();t.innerHTML='<option value="">בחרי קודם טיפול ותאריך</option>'}).withFailureHandler(err).bookAppointment(x)}</script></body></html>
