<!doctype html>
<html lang="he" dir="rtl"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול עסק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#432d35;--rose:#a6536e;--paper:#fff8f7;--line:#ead9dc;--muted:#806b72}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,Arial,sans-serif}.top{padding:22px max(20px,calc((100vw - 1060px)/2));background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.brand b{color:var(--rose)}.wrap{max-width:1060px;margin:auto;padding:38px 20px 72px}h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:0 0 9px}h1 em{color:var(--rose);font-style:normal}.intro,.muted{color:var(--muted);line-height:1.6}.login{max-width:410px;margin:10vh auto;background:#fff;padding:28px;border:1px solid var(--line);border-radius:18px}.login h1{font-size:36px}.field{display:block;font-weight:700;margin-top:16px}.field input,.field select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);background:#fff;font:16px Heebo;border-radius:8px}.btn{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:11px 16px;font:700 15px Heebo;cursor:pointer}.btn.rose{background:var(--rose)}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.login .btn{width:100%;margin-top:20px}.error{margin-top:14px;padding:10px;background:#fee9e9;color:#922d38;border-radius:7px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat b{display:block;color:var(--rose);font-size:30px;line-height:1}.stat span{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:25px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px;font:700 14px Heebo;cursor:pointer}.tab.active{background:var(--ink);color:white}.panel{padding:18px}.panel h2{margin:0 0 4px;font-size:24px}.appointment{padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 155px;gap:12px}.appointment:last-child{border:0}.appointment h3{margin:0;font-size:18px}.appointment small{color:var(--muted);display:block}.appointment select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:14px Heebo}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.gallery article{border:1px solid var(--line);border-radius:10px;overflow:hidden}.gallery img{width:100%;height:170px;object-fit:cover;background:#f1e6e8}.gallery .body{padding:11px}.gallery input[type=file]{width:100%;font:13px Heebo;margin-top:8px}.check{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:14px}.settings{max-width:530px}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;display:none}@media(max-width:600px){.stats{grid-template-columns:1fr}.appointment{grid-template-columns:1fr}.wrap{padding-top:28px}}
</style></head><body>
<header class="top"><div class="brand">FLOW<b>PAGE</b> · פדיקור ומניקור</div><span class="muted">מרחב בעלת העסק</span></header>
<main id="app" class="wrap"><p class="muted">OWNER SPACE</p><h1>העסק שלך, <em>בשליטה.</em></h1><p class="intro">תורים, לקוחות, גלריה והגדרות — ממקום אחד.</p><section class="stats"><div class="stat"><b id="today">–</b><span>תורים להיום</span></div><div class="stat"><b id="active">–</b><span>תורים פעילים</span></div><div class="stat"><b id="total">–</b><span>סה״כ תורים</span></div></section><nav class="tabs"><button class="tab active" data-tab="appointments">תורים</button><button class="tab" data-tab="gallery">גלריה</button><button class="tab" data-tab="settings">הגדרות</button></nav><section id="out" class="panel"></section></main><div id="toast" class="toast"></div>
<script>
let pin='',data=null,tab='appointments';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fail(e,target='loginError'){const m=e&&e.message?e.message:String(e);$(target).innerHTML='<div class="error">'+esc(m)+'</div>'}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function call(fn,args,ok){google.script.run.withSuccessHandler(ok).withFailureHandler(e=>fail(e,tab==='appointments'?'out':'out'))[fn](...args)}
function startManagement(){call('adminLogin',[pin],render)}startManagement();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render(data)});
function render(d){data=d;$('today').textContent=d.todayCount;$('active').textContent=d.activeCount;$('total').textContent=d.appointments.length;if(tab==='appointments')appointments();if(tab==='gallery')gallery();if(tab==='settings')settings()}
function appointments(){const rows=data.appointments;if(!rows.length){$('out').innerHTML='<h2>אין תורים כרגע</h2><p class="muted">התורים החדשים יופיעו כאן.</p>';return}$('out').innerHTML='<h2>ניהול תורים</h2><p class="muted">שינוי ל״בוטל״ מוחק את האירוע מהיומן ושולח עדכון במייל, אם הוזן.</p>'+rows.map(x=>'<article class="appointment"><div><h3>'+esc(x.name)+' · '+esc(x.service)+'</h3><small>'+esc(x.start)+' · '+esc(x.phone)+(x.email?' · '+esc(x.email):'')+'</small><small>'+esc(x.id)+'</small></div><select data-id="'+esc(x.id)+'">'+data.statuses.map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join('');$('out').querySelectorAll('select').forEach(s=>s.onchange=()=>call('updateAppointmentStatus',[pin,s.dataset.id,s.value],()=>{toast('הסטטוס עודכן');refresh()}))}
function gallery(){call('getGalleryData',[pin],items=>{$('out').innerHTML='<h2>ניהול גלריה</h2><p class="muted">מעלים או מסתירים עבודות בלי לעדכן קוד באתר.</p><div class="gallery">'+items.map(x=>'<article data-id="'+esc(x.id)+'"><img src="'+esc(x.url)+'" alt=""><div class="body"><label class="field">קטגוריה<input class="category" value="'+esc(x.category)+'"></label><label class="field">כותרת<input class="title" value="'+esc(x.title)+'"></label><label class="check"><input class="active" type="checkbox" '+(x.active?'checked':'')+'> מוצג באתר</label><input class="image" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn light save">שמירת פרטים</button></div></article>').join('')+'</div>'; $('out').querySelectorAll('article').forEach(card=>{card.querySelector('.save').onclick=()=>call('saveGalleryItem',[pin,{id:card.dataset.id,category:card.querySelector('.category').value,title:card.querySelector('.title').value,active:card.querySelector('.active').checked}],()=>{toast('הגלריה נשמרה');gallery()});card.querySelector('.image').onchange=e=>upload(card,e.target.files[0])})})}
function upload(card,file){if(!file)return;if(file.size>8*1024*1024){fail(new Error('התמונה מוגבלת ל־8MB.'));return}const r=new FileReader();r.onload=()=>call('replaceGalleryImage',[pin,card.dataset.id,{name:file.name,mimeType:file.type,size:file.size,base64:r.result.split(',')[1]}],()=>{toast('התמונה הוחלפה');gallery()});r.readAsDataURL(file)}
function settings(){const s=data.settings;$('out').innerHTML='<div class="settings"><h2>הגדרות העסק</h2><p class="muted">כתובת ההתראות והיומן שאליו ייכנסו התורים.</p><label class="field">מייל להתראות<input id="ownerEmail" type="email" value="'+esc(s.OWNER_EMAIL)+'"></label><label class="field">מזהה יומן Google<input id="calendarId" value="'+esc(s.CALENDAR_ID)+'"><small class="muted">השאירי primary כדי להשתמש ביומן הראשי.</small></label><button class="btn rose" id="saveSettings">שמירת הגדרות</button></div>';$('saveSettings').onclick=()=>call('saveSettings',[pin,{OWNER_EMAIL:$('ownerEmail').value,CALENDAR_ID:$('calendarId').value}],()=>{toast('ההגדרות נשמרו');refresh()})}
function refresh(){call('getManagementData',[pin],render)}
</script></body></html>
