<!doctype html>
<html dir="rtl" lang="he"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#302019;--brown:#4a2c21;--accent:#bb6c45;--cream:#fff8f2;--line:#eadfd6;--muted:#77665f;--danger:#a93d31;--ok:#2e7048}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;font-size:15px}header{background:var(--brown);color:#fff;padding:20px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}h1,h2,h3,p{margin-top:0}h1{font-size:25px;margin-bottom:5px}.subtitle{margin:0;color:#f2d5c4;font-size:13px}.reload{background:transparent;border:1px solid #d9a78d;color:#fff;padding:8px 11px;margin:0}.tabs{background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:0 max(10px,calc((100% - 1100px)/2));position:sticky;top:0;z-index:3}.tab{display:inline-block;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);padding:15px 13px;margin:0;font-weight:bold;cursor:pointer}.tab.active{color:var(--brown);border-bottom-color:var(--accent)}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:15px;border-radius:14px;background:#f9efe9}.metric b{display:block;font-size:27px;color:var(--brown)}.metric span,.hint,.empty{color:var(--muted);font-size:13px;line-height:1.5}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{min-width:0}.wide{grid-column:span 2}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin:4px 0 5px}input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #dfd0c5;background:#fff;border-radius:9px;color:var(--ink)}button{font:inherit;border:0;border-radius:9px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#f4e8e0;color:var(--brown)}button.danger{background:#fff0ee;color:var(--danger)}button.small{padding:7px 9px;font-size:12px;margin-right:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0;font-size:20px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:normal;background:#fffaf7}.pill,.status{font-size:12px;display:inline-block;padding:4px 8px;border-radius:999px;background:#f4e8e0;color:var(--brown)}.pill.off{background:#eee;color:#666}.bom-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:9px 0}.notice{position:fixed;bottom:16px;right:16px;left:16px;max-width:500px;margin:auto;padding:12px 14px;color:#fff;background:var(--ok);border-radius:11px;box-shadow:0 5px 20px #0002;display:none;z-index:5}.notice.error{background:var(--danger)}.order-lines{margin:8px 0}.line-row{display:grid;grid-template-columns:1fr 90px auto;gap:7px;margin-bottom:7px}.plan-detail{background:#fffaf7;border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:12px}.cost{font-weight:bold;color:var(--brown)}@media(max-width:720px){header{padding:17px}main{padding:12px}.grid{grid-template-columns:1fr 1fr}.two,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:14px}.tab{padding:13px 10px}.line-row{grid-template-columns:1fr 70px auto}}
</style></head>
<body><header><div><h1>BakeFlow</h1><p class="subtitle">ניהול ייצור למאפייה · הזמנות → BOM → תכנון → אריזה</p></div><button class="reload" onclick="loadData()">רענון נתונים</button></header><nav class="tabs" id="tabs"></nav><main id="app"><div class="card">טוען את נתוני המערכת…</div></main><div id="notice" class="notice"></div>
<script>
const $=id=>document.getElementById(id), TABS=[['dashboard','סקירה'],['orders','הזמנות'],['customers','לקוחות'],['products','מוצרים'],['ingredients','חומרי גלם'],['recipes','מתכונים · BOM'],['production','ייצור · קניות · אריזה']];
let state={products:[],ingredients:[],customers:[],orders:[],recipeIngredients:[],recipeSteps:[],recipeMedia:[],plans:[],dashboard:{}},view='dashboard',edit={customer:null,product:null,ingredient:null,order:null},selectedRecipe='',planDetails=null;
const call=(n,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[n](...a));
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])), money=v=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(Number(v)||0), date=v=>v?String(v).slice(0,10):'', active=a=>a.filter(x=>x.active!==false);
function toast(m,bad=false){const n=$('notice');n.textContent=m;n.className='notice'+(bad?' error':'');n.style.display='block';setTimeout(()=>n.style.display='none',3200)}
async function run(n,...a){try{const r=await call(n,...a);toast(r?.message||'נשמר בהצלחה');await loadData(false);return r}catch(e){toast(e?.message||String(e),true);throw e}}
function tabs(){$('tabs').innerHTML=TABS.map(([id,l])=>'<button class="tab '+(view===id?'active':'')+'" onclick="go(\''+id+'\')">'+l+'</button>').join('')}
function go(v){view=v;planDetails=null;tabs();render()}
async function loadData(paint=true){try{const r=await call('getAppDataSafe');if(!r||!r.ok)throw new Error(r?.error||'לא התקבלה תשובה מהשרת');state=r.data;selectedRecipe=selectedRecipe||state.products[0]?.id||'';if(paint){tabs();render()}}catch(e){$('app').innerHTML='<section class="card"><h2>לא ניתן לטעון נתונים</h2><p>'+esc(e.message||e)+'</p><p class="hint">ודא שהרצת setupBakeFlow ושהפריסה מעודכנת.</p></section>';toast(e.message||String(e),true)}}
function render(){({dashboard,orders,customers,products,ingredients,recipes,production})[view]();if(view==='orders')setTimeout(initOrderLines)}
function dashboard(){const d=state.dashboard||{};$('app').innerHTML='<section class="card"><div class="section-head"><div><h2>תמונת מצב</h2><p class="hint">מה מחכה לבעל העסק עכשיו.</p></div><button onclick="go(\'orders\')">הזמנה חדשה</button></div><div class="grid">'+metric(d.openOrders||0,'הזמנות פתוחות')+metric(d.counts?.['ממתינה']||0,'ממתינות לתכנון')+metric(d.production||0,'אצוות בייצור')+metric(d.packing||0,'מוכנות לאריזה')+'</div></section><section class="card"><div class="section-head"><h2>הזמנות אחרונות</h2><button class="secondary" onclick="go(\'production\')">לתכנון ייצור</button></div>'+ordersTable(state.orders.slice(0,5),true)+'</section>'}
function metric(v,l){return '<div class="metric"><b>'+v+'</b><span>'+l+'</span></div>'}
function ordersTable(list,short=false){if(!list.length)return '<p class="empty">אין עדיין הזמנות.</p>';return '<div class="table-wrap"><table><thead><tr><th>לקוח</th><th>מסירה</th><th>פריטים</th><th>סטטוס</th>'+(short?'':'<th>פעולות</th>')+'</tr></thead><tbody>'+list.map(o=>'<tr><td><b>'+esc(o.customer)+'</b><br><small>'+esc(o.phone||'')+'</small></td><td>'+date(o.deliveryDate)+'</td><td>'+o.lines.map(l=>esc(l.productName)+' × '+l.quantity).join('<br>')+'</td><td><span class="status">'+esc(o.status)+'</span></td>'+(short?'':'<td><button class="small secondary" onclick="editOrder(\''+o.id+'\')">עריכה</button><button class="small danger" onclick="removeOrder(\''+o.id+'\')">מחיקה</button></td>')+'</tr>').join('')+'</tbody></table></div>'}
function orders(){const o=edit.order;$('app').innerHTML='<section class="card"><div class="section-head"><div><h2>'+(o?'עריכת הזמנה':'הזמנה חדשה')+'</h2><p class="hint">בסיום ניתן להעביר אותה לתכנון ייצור.</p></div>'+(o?'<button class="secondary" onclick="edit.order=null;render()">ביטול עריכה</button>':'')+'</div><div class="form-grid">'+field('orderCustomer','שם לקוח',o?.customer||'')+field('orderPhone','טלפון',o?.phone||'')+field('orderDelivery','תאריך מסירה',date(o?.deliveryDate)||date(new Date()),'date')+selectField('orderStatus','סטטוס',['ממתינה','מתוכננת','בייצור','מוכנה לאריזה','מוכנה למסירה','נמסרה'],o?.status||'ממתינה')+'<div class="field wide"><label>הערות</label><input id="orderNotes" value="'+esc(o?.notes||'')+'"></div></div><div class="order-lines" id="orderLines"></div><button class="secondary" onclick="addOrderLine()">+ הוסף מוצר להזמנה</button><div><button onclick="submitOrder()">'+(o?'שמור שינויים':'שמור הזמנה')+'</button></div></section><section class="card"><div class="section-head"><h2>כל ההזמנות</h2><span class="hint">'+state.orders.length+' רשומות</span></div>'+ordersTable(state.orders)+'</section>'}
function field(id,label,value,type='text'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'"></div>'}function selectField(id,label,opts,value){return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(x=>'<option '+(x===value?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'}
function lineHtml(l={}){return '<div class="line-row"><select class="line-product"><option value="">בחר מוצר</option>'+active(state.products).map(p=>'<option value="'+p.id+'" '+(l.productId===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><input class="line-qty" type="number" min="1" value="'+(l.quantity||1)+'"><button class="danger small" onclick="this.parentElement.remove()">הסר</button></div>'}
function initOrderLines(){const b=$('orderLines');if(b&&!b.children.length)b.innerHTML=(edit.order?.lines?.length?edit.order.lines:[{}]).map(lineHtml).join('')}function addOrderLine(){$('orderLines').insertAdjacentHTML('beforeend',lineHtml())}
async function submitOrder(){const lines=[...document.querySelectorAll('#orderLines .line-row')].map(r=>({productId:r.querySelector('.line-product').value,quantity:r.querySelector('.line-qty').value})).filter(x=>x.productId&&Number(x.quantity)>0),p={customer:$('orderCustomer').value,phone:$('orderPhone').value,deliveryDate:$('orderDelivery').value,status:$('orderStatus').value,notes:$('orderNotes').value,lines};try{if(edit.order)await run('updateOrder',edit.order.id,p);else await run('saveOrder',p);edit.order=null;render()}catch(e){}}
function editOrder(id){edit.order=state.orders.find(x=>x.id===id);render()}async function removeOrder(id){if(confirm('למחוק את ההזמנה ואת שורות ההזמנה שלה?'))await run('deleteOrder',id)}
function entityForm(k,item){const cfg={customer:{title:'לקוח',fs:[['name','שם לקוח'],['phone','טלפון'],['email','אימייל'],['address','כתובת'],['notes','הערות']]},product:{title:'מוצר',fs:[['name','שם מוצר'],['category','קטגוריה'],['unit','יחידת ייצור'],['salePrice','מחיר מכירה','number'],['targetCost','עלות יעד','number'],['minutes','זמן הכנה בדקות','number']]},ingredient:{title:'חומר גלם',fs:[['name','שם חומר גלם'],['unit','יחידת מידה'],['cost','עלות ליחידה','number'],['supplier','ספק']]}}[k];return '<section class="card"><div class="section-head"><div><h2>'+(item?'עריכת ':'הוספת ')+cfg.title+'</h2><p class="hint">המידע נשמר בגיליון הנתונים.</p></div>'+(item?'<button class="secondary" onclick="edit.'+k+'=null;render()">ביטול</button>':'')+'</div><div class="form-grid">'+cfg.fs.map(f=>field(k+'-'+f[0],f[1],item?.[f[0]]??'',f[2]||'text')).join('')+selectField(k+'-active','פעיל במערכת',['yes','no'],item?.active===false?'no':'yes')+'</div><button onclick="saveEntity(\''+k+'\')">'+(item?'שמור שינויים':'הוסף '+cfg.title)+'</button></section>'}
function entityTable(k,list){if(!list.length)return '<p class="empty">אין רשומות להצגה.</p>';const heads={customer:['שם','טלפון','אימייל'],product:['שם','קטגוריה','מחיר'],ingredient:['שם','יחידה','עלות']}[k];return '<div class="table-wrap"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'<th>מצב</th><th>פעולות</th></tr></thead><tbody>'+list.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td>'+(k==='customer'?'<td>'+esc(x.phone||'')+'</td><td>'+esc(x.email||'')+'</td>':k==='product'?'<td>'+esc(x.category||'—')+'</td><td>'+money(x.salePrice)+'</td>':'<td>'+esc(x.unit)+'</td><td>'+money(x.cost)+'</td>')+'<td><span class="pill '+(x.active===false?'off':'')+'">'+(x.active===false?'לא פעיל':'פעיל')+'</span></td><td><button class="small secondary" onclick="editEntity(\''+k+'\',\''+x.id+'\')">עריכה</button><button class="small danger" onclick="deleteEntity(\''+k+'\',\''+x.id+'\')">מחיקה</button></td></tr>').join('')+'</tbody></table></div>'}
function customers(){$('app').innerHTML=entityForm('customer',edit.customer)+'<section class="card"><div class="section-head"><h2>לקוחות</h2><span class="hint">'+state.customers.length+' רשומות</span></div>'+entityTable('customer',state.customers)+'</section>'}function products(){$('app').innerHTML=entityForm('product',edit.product)+'<section class="card"><div class="section-head"><h2>קטלוג מוצרים</h2><span class="hint">מוצר לא פעיל לא יוצע להזמנות חדשות.</span></div>'+entityTable('product',state.products)+'</section>'}function ingredients(){$('app').innerHTML=entityForm('ingredient',edit.ingredient)+'<section class="card"><div class="section-head"><h2>מאגר חומרי גלם</h2><span class="hint">עלות ליחידת המידה שנבחרה.</span></div>'+entityTable('ingredient',state.ingredients)+'</section>'}
async function saveEntity(k){const fs={customer:['name','phone','email','address','notes'],product:['name','category','unit','salePrice','targetCost','minutes'],ingredient:['name','unit','cost','supplier']}[k],p=Object.fromEntries(fs.map(x=>[x,$(k+'-'+x).value]));p.active=$(k+'-active').value==='yes';try{if(edit[k])await run('update'+cap(k),edit[k].id,p);else await run('save'+cap(k),p);edit[k]=null;render()}catch(e){}}function cap(x){return x[0].toUpperCase()+x.slice(1)}function editEntity(k,id){edit[k]=state[{customer:'customers',product:'products',ingredient:'ingredients'}[k]].find(x=>x.id===id);render()}async function deleteEntity(k,id){if(confirm('למחוק רשומה זו?'))await run('delete'+cap(k),id)}
function recipes(){const p=state.products.find(x=>x.id===selectedRecipe)||state.products[0];if(!p){$('app').innerHTML='<section class="card"><h2>יש להוסיף מוצר ראשון</h2></section>';return}const bom=state.recipeIngredients.filter(x=>x.productId===p.id),steps=state.recipeSteps.filter(x=>x.productId===p.id).sort((a,b)=>a.order-b.order),media=state.recipeMedia.filter(x=>x.productId===p.id),total=bom.reduce((s,x)=>s+x.cost,0);$('app').innerHTML='<section class="card"><div class="section-head"><div><h2>מתכון ועץ פריט</h2><p class="hint">כל כמות היא עבור יחידת מוצר אחת.</p></div><select style="max-width:280px" onchange="selectedRecipe=this.value;render()">'+state.products.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="two"><div><h3>רכיבי BOM</h3>'+(bom.length?bom.map(x=>'<div class="bom-line"><span>'+esc(x.name)+'<br><small>'+x.quantity+' '+esc(x.unit)+' · '+money(x.cost)+'</small></span><button class="danger small" onclick="removeBom('+x.rowNumber+')">הסר</button></div>').join(''):'<p class="empty">אין עדיין רכיבים.</p>')+'<p class="cost">עלות חומרי גלם: '+money(total)+'</p><div class="form-grid">'+selectField('bomIngredient','חומר גלם',['בחר חומר'].concat(active(state.ingredients).map(i=>i.id)), 'בחר חומר').replace(/<option([^>]*)>([^<]*)<\/option>/g,(m,a,t)=>t==='בחר חומר'?m:'<option'+a+'>'+esc(state.ingredients.find(i=>i.id===t).name)+' · '+esc(state.ingredients.find(i=>i.id===t).unit)+'</option>')+field('bomQuantity','כמות','','number')+'</div><button onclick="addBom(\''+p.id+'\')">הוסף רכיב</button></div><div><h3>שלבי עבודה</h3>'+(steps.length?steps.map(s=>'<div class="bom-line"><span><b>'+s.order+'. '+esc(s.title)+'</b><br><small>'+(s.minutes?s.minutes+' דקות · ':'')+esc(s.note||'')+'</small></span><button class="danger small" onclick="removeStep('+s.rowNumber+')">הסר</button></div>').join(''):'<p class="empty">אין שלבי עבודה כתובים.</p>')+'<div class="form-grid">'+field('stepTitle','שלב')+field('stepMinutes','משך בדקות','','number')+'<div class="field full"><label>הערה</label><input id="stepNote"></div></div><button onclick="addStep(\''+p.id+'\','+(steps.length+1)+')">הוסף שלב</button></div></div></section><section class="card"><h2>תמונות למתכון</h2><p class="hint">התמונה נשמרת בתיקיית Drive של BakeFlow.</p>'+media.map(m=>'<div class="bom-line"><a href="'+esc(m.url)+'" target="_blank">'+esc(m.title)+'</a><button class="danger small" onclick="removeMedia('+m.rowNumber+')">הסר</button></div>').join('')+'<div class="form-grid"><div class="field"><label>בחר תמונה</label><input id="recipeFile" type="file" accept="image/*"></div>'+field('mediaTitle','כותרת')+'</div><button onclick="uploadMedia(\''+p.id+'\')">שמור תמונה</button></section>'}
async function addBom(p){const selected=$('bomIngredient').value;const ingredient=state.ingredients.find(i=>i.id===selected)||state.ingredients.find(i=>(i.name+' · '+i.unit)===selected);try{await run('saveRecipeIngredient',{productId:p,ingredientId:ingredient?.id||selected,quantity:$('bomQuantity').value})}catch(e){}}async function removeBom(r){if(confirm('להסיר רכיב מעץ הפריט?'))await run('deleteRecipeIngredient',r)}async function addStep(p,o){try{await run('saveRecipeStep',{productId:p,order:o,title:$('stepTitle').value,minutes:$('stepMinutes').value,note:$('stepNote').value})}catch(e){}}async function removeStep(r){if(confirm('להסיר שלב עבודה?'))await run('deleteRecipeStep',r)}async function removeMedia(r){if(confirm('להסיר קישור למדיה?'))await run('deleteRecipeMedia',r)}
function uploadMedia(p){const f=$('recipeFile').files[0];if(!f){toast('יש לבחור תמונה.',true);return}const r=new FileReader();r.onload=async()=>{try{await run('uploadRecipeImage',{productId:p,fileName:f.name,mimeType:f.type,base64:String(r.result).split(',')[1],title:$('mediaTitle').value})}catch(e){}};r.readAsDataURL(f)}
function production(){$('app').innerHTML='<section class="card"><div class="section-head"><div><h2>תוכנית ייצור</h2><p class="hint">מחבר הזמנות פתוחות, BOM ועלויות לרשימת קניות אחת.</p></div></div><div class="form-grid">'+field('planFrom','מתאריך',date(new Date()),'date')+field('planTo','עד תאריך',date(new Date(Date.now()+7*86400000)),'date')+'</div><button onclick="createPlan()">צור תוכנית עבודה</button></section><section class="card"><h2>תוכניות שנוצרו</h2>'+(state.plans.length?'<div class="table-wrap"><table><thead><tr><th>טווח</th><th>סטטוס</th><th></th></tr></thead><tbody>'+state.plans.map(p=>'<tr><td>'+date(p.from)+' עד '+date(p.to)+'</td><td>'+esc(p.status)+'</td><td><button class="small secondary" onclick="showPlan(\''+p.id+'\')">פתח</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">עדיין לא נוצרה תוכנית.</p>')+(planDetails?planHtml(planDetails):'')+'</section>'}
async function createPlan(){try{planDetails=await run('createProductionPlan',$('planFrom').value,$('planTo').value);render()}catch(e){}}async function showPlan(id){try{planDetails=await call('getPlanDetails',id);render()}catch(e){toast(e.message||String(e),true)}}function planHtml(d){return '<div class="plan-detail"><h3>רשימת קניות · עלות משוערת '+money(d.totalCost)+'</h3>'+(d.shopping||[]).map(i=>'<div class="bom-line"><span>'+esc(i.name)+'</span><b>'+Number(i.quantity).toFixed(3)+' '+esc(i.unit)+' · '+money(i.cost)+'</b></div>').join('')+'<h3 style="margin-top:20px">תוכנית עבודה</h3>'+d.batches.map(b=>'<div class="card" style="margin:8px 0;padding:12px"><b>'+esc(b.productName)+' × '+b.quantity+'</b><p class="hint">'+(b.steps.map(s=>s.title).join(' ← ')||'אין שלבי עבודה מוגדרים')+'</p><select onchange="setBatch(\''+b.id+'\',this.value)">'+['מתוכננת','בייצור','מוכנה'].map(x=>'<option '+(b.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join('')+'<h3 style="margin-top:20px">אריזה ומסירה</h3>'+d.packing.map(o=>'<div class="bom-line"><span><b>'+esc(o.customer)+'</b><br><small>'+o.lines.map(l=>l.productName+' × '+l.quantity).join(' · ')+'</small></span><select onchange="setOrder(\''+o.id+'\',this.value)">'+['ממתינה','מתוכננת','בייצור','מוכנה לאריזה','מוכנה למסירה','נמסרה'].map(x=>'<option '+(o.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join('')+'</div>'}
async function setBatch(id,s){await run('setBatchStatus',id,s);if(planDetails)planDetails=await call('getPlanDetails',planDetails.plan.id);render()}async function setOrder(id,s){await run('setOrderStatus',id,s);if(planDetails)planDetails=await call('getPlanDetails',planDetails.plan.id);render()}loadData();
</script></body></html>
