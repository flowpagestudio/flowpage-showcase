<!doctype html><html dir="rtl" lang="he"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#fff8f2;color:#302019;font-family:Arial,sans-serif}header{background:#4a2c21;color:#fff;padding:24px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#f2d5c4;font-size:13px}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #eadfd6;border-radius:16px;padding:16px;margin:12px 0}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid #eadfd6;border-radius:13px;padding:12px}.product b{display:block}.muted{color:#77665f;font-size:13px;line-height:1.5}label{display:block;font-size:12px;color:#77665f;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #dfd0c5;border-radius:9px;box-sizing:border-box;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:150px}button{background:#bb6c45;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:bold;margin-top:12px}.bom{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #eadfd6}.total{background:#f6ebe3;padding:11px;border-radius:10px;margin-top:12px}.notice{display:none;background:#dff0e3;color:#285a37;padding:11px;border-radius:9px;margin-top:10px}@media(max-width:600px){.products{grid-template-columns:1fr}.row{display:block}}
</style></head><body><header><h1>BakeFlow</h1><p>דמו קבוע: הזמנות → BOM → תכנון ייצור</p></header><main>
<section class="card"><h2>שלושת מוצרי ההדגמה</h2><p class="muted">הם קבועים במערכת. אין טעינה, איפוס או הגדרה מקדימה.</p><div id="products" class="products"></div></section>
<section class="card"><h2>רשימת חומרי גלם ועלויות</h2><p class="muted">מאגר החומרים שמרכיב את שלושת עצי הפריט.</p><div id="ingredients"></div></section>
<section class="card"><h2>עץ פריט · BOM</h2><label>בחר מוצר</label><select id="bomProduct" onchange="renderBom()"></select><div id="bom"></div></section>
<section class="card"><h2>הזמנה חדשה</h2><div class="row"><div class="field"><label>שם לקוח</label><input id="customer" placeholder="למשל: משפחת כהן"></div><div class="field"><label>תאריך מסירה</label><input id="delivery" type="date"></div></div><div class="row"><div class="field"><label>מוצר</label><select id="orderProduct"></select></div><div class="field"><label>כמות</label><input id="qty" type="number" min="1" value="1"></div></div><button onclick="saveOrder()">שמור הזמנה</button><div id="notice" class="notice"></div></section>
</main><script>
let data={products:[],ingredients:[],recipeIngredients:[]};const $=x=>document.getElementById(x);const money=x=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(x||0);function call(n,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[n](...a))}function options(){return data.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}function render(){const o=options();$('bomProduct').innerHTML=o;$('orderProduct').innerHTML=o;$('products').innerHTML=data.products.map(p=>`<div class="product"><b>${p.name}</b><span class="muted">${p.category||''}<br>מחיר דוגמה: ${money(p.salePrice)}</span></div>`).join('');$('ingredients').innerHTML=data.ingredients.map(i=>`<div class="bom"><span>${i.name} · ${i.unit}</span><b>${money(i.cost)} / ${i.unit}</b></div>`).join('');renderBom()}function renderBom(){const id=$('bomProduct').value;const items=data.recipeIngredients.filter(x=>x.productId===id);const total=items.reduce((s,x)=>s+x.cost,0);$('bom').innerHTML=items.map(x=>`<div class="bom"><span>${x.name}</span><span>${x.quantity} ${x.unit}<br><small>${money(x.cost)}</small></span></div>`).join('')+`<div class="total"><b>עלות BOM למוצר: ${money(total)}</b></div>`}async function saveOrder(){try{const r=await call('saveOrder',{customer:$('customer').value,deliveryDate:$('delivery').value,lines:[{productId:$('orderProduct').value,quantity:$('qty').value}]});$('notice').textContent=`ההזמנה נשמרה · ${r.id}`;$('notice').style.display='block'}catch(e){$('notice').textContent=e.message||String(e);$('notice').style.background='#f7e2df';$('notice').style.color='#842d22';$('notice').style.display='block'}}async function boot(){try{data=await call('getAppData');render()}catch(e){$('products').innerHTML='<p>יש להריץ setupBakeFlow פעם אחת.</p>'}}$('delivery').value=new Date().toISOString().slice(0,10);boot();
</script></body></html>
